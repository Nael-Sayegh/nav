version: 2
updates:
  # Composer dependencies for main project
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "wednesday"
      time: "13:45"
      timezone: "Europe/Paris"
    rebase-strategy: "auto"
    open-pull-requests-limit: 10
    assignees:
      - "Nael-Sayegh"
    labels:
      - "dependencies"
    target-branch: "dev"
    # Group all Composer dependencies into a single PR
    groups:
      composer-dependencies:
        patterns:
          - "*"
    # Note: Dependabot automatically ignores vendor/ directories
    # is handled by only monitoring the root directory

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "wednesday"
      time: "13:45"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    assignees:
      - "Nael-Sayegh"
    labels:
      - "dependencies"
    target-branch: "dev"
    # Group all submodule updates into a single PR
    groups:
      submodule-updates:
        patterns:
          - "*"
